var INDICATORS = [
 {id:'hemoglobina', name:'Hemoglobina', category:'hematologia', unit:'g/dL', aliases:['Hb','Hgb','Hemoglobina (Hb)'], ref:{M:{min:13.5,max:17.5}, F:{min:12.0,max:15.5}}, desc:"Proteína de los glóbulos rojos que transporta oxígeno por el cuerpo.", descFull:"La hemoglobina es la proteína que le da su color rojo a la sangre y se encarga de transportar el oxígeno desde los pulmones hacia el resto de los tejidos, y el dióxido de carbono de vuelta hacia los pulmones. Valores bajos pueden estar relacionados con anemia (por ejemplo, por deficiencia de hierro), mientras que valores muy altos pueden asociarse con deshidratación o con condiciones que aumentan la producción de glóbulos rojos."},
 {id:'hematocrito', name:'Hematocrito', category:'hematologia', unit:'%', aliases:['Hto','HCT'], ref:{M:{min:41,max:53}, F:{min:36,max:46}}, desc:"Porcentaje del volumen de sangre ocupado por glóbulos rojos.", descFull:"El hematocrito mide qué proporción de la sangre está compuesta por glóbulos rojos. Suele variar en la misma dirección que la hemoglobina, por eso ambos se piden juntos: un hematocrito bajo puede acompañar a un cuadro de anemia, mientras que uno elevado puede relacionarse con deshidratación o con la altitud, entre otras causas."},
 {id:'eritrocitos', name:'Eritrocitos', category:'hematologia', unit:'mill/µL', aliases:['Glóbulos Rojos','RBC','Hematíes'], ref:{def:{min:4.2,max:5.9}}, desc:"Cantidad de glóbulos rojos por microlitro de sangre.", descFull:"Los eritrocitos, o glóbulos rojos, son las células encargadas de transportar oxígeno gracias a la hemoglobina que contienen. Su conteo se usa junto con la hemoglobina y el hematocrito para evaluar si existe anemia (conteo bajo) u otras condiciones que aumenten su producción (conteo alto)."},
 {id:'leucocitos', name:'Leucocitos', category:'hematologia', unit:'x10³/µL', aliases:['Glóbulos Blancos','WBC'], ref:{def:{min:4.5,max:11.0}}, desc:"Células del sistema inmunológico que defienden al cuerpo de infecciones.", descFull:"Los leucocitos son las células blancas de la sangre, encargadas de la defensa contra infecciones y otros agentes externos. Un conteo elevado suele aparecer cuando el cuerpo está combatiendo una infección o inflamación, mientras que un conteo bajo puede relacionarse con ciertas infecciones virales, medicamentos o condiciones que afectan la médula ósea."},
 {id:'plaquetas', name:'Plaquetas', category:'hematologia', unit:'x10³/µL', aliases:['Platelets','Recuento Plaquetario'], ref:{def:{min:150,max:450}}, desc:"Fragmentos celulares que permiten que la sangre coagule.", descFull:"Las plaquetas son responsables de la coagulación: cuando hay una herida, se agrupan para formar un tapón que detiene el sangrado. Un conteo bajo (trombocitopenia) puede aumentar el riesgo de sangrados o moretones, mientras que un conteo alto puede asociarse con inflamación, ciertas infecciones o trastornos de la médula ósea."},
 {id:'neutrofilos', name:'Neutrófilos', category:'hematologia', unit:'%', aliases:['Neutrófilos Segmentados'], ref:{def:{min:40,max:70}}, desc:"Tipo de glóbulo blanco, primera línea de defensa contra infecciones bacterianas.", descFull:"Los neutrófilos son el tipo más abundante de glóbulo blanco y actúan como primera respuesta ante infecciones, especialmente bacterianas. Su proporción suele subir en infecciones agudas o inflamación, y puede bajar por infecciones virales, ciertos medicamentos o condiciones que afectan la médula ósea."},
 {id:'linfocitos', name:'Linfocitos', category:'hematologia', unit:'%', aliases:[], ref:{def:{min:20,max:40}}, desc:"Tipo de glóbulo blanco clave en la respuesta inmune contra virus.", descFull:"Los linfocitos son un tipo de glóbulo blanco central en la respuesta inmune, especialmente frente a virus, y en la producción de anticuerpos. Su proporción puede subir durante infecciones virales y bajar en algunas infecciones agudas bacterianas o por efecto de ciertos tratamientos."},
 {id:'colesterol_total', name:'Colesterol Total', category:'lipidico', unit:'mg/dL', aliases:['Colesterol'], ref:{def:{min:null,max:200}}, desc:"Suma de todo el colesterol presente en la sangre (LDL + HDL + otros).", descFull:"El colesterol total es la suma de todas las formas de colesterol que circulan en la sangre, incluyendo el LDL ('colesterol malo'), el HDL ('colesterol bueno') y otros componentes. Se usa como una primera aproximación al riesgo cardiovascular, aunque el desglose entre LDL y HDL suele ser más informativo que el total por sí solo."},
 {id:'ldl', name:'LDL', category:'lipidico', unit:'mg/dL', aliases:['Colesterol LDL','C-LDL','LDL Colesterol'], ref:{def:{min:null,max:130}}, desc:"Conocido como 'colesterol malo'; su exceso puede acumularse en las arterias.", descFull:"El LDL, conocido popularmente como 'colesterol malo', transporta colesterol desde el hígado hacia el resto del cuerpo. Cuando está elevado, puede depositarse en las paredes de las arterias y contribuir con el tiempo a que se estrechen y endurezcan (aterosclerosis), lo que se asocia a un mayor riesgo cardiovascular. Por eso suele ser uno de los primeros valores que se revisan en un chequeo de salud cardiovascular."},
 {id:'hdl', name:'HDL', category:'lipidico', unit:'mg/dL', aliases:['Colesterol HDL','C-HDL','HDL Colesterol'], ref:{def:{min:40,max:null}}, desc:"Conocido como 'colesterol bueno'; ayuda a retirar colesterol de las arterias.", descFull:"El HDL, o 'colesterol bueno', cumple la función contraria al LDL: recoge el exceso de colesterol de los tejidos y las arterias y lo lleva de vuelta al hígado para eliminarlo. A diferencia de otros indicadores, aquí valores más altos suelen considerarse favorables, mientras que niveles bajos se han asociado con un mayor riesgo cardiovascular."},
 {id:'trigliceridos', name:'Triglicéridos', category:'lipidico', unit:'mg/dL', aliases:['Triglicéridos Totales'], ref:{def:{min:null,max:150}}, desc:"Principal forma en que el cuerpo almacena la energía de las grasas.", descFull:"Los triglicéridos son la forma en que el cuerpo almacena el exceso de calorías, especialmente las provenientes de grasas y azúcares, para usarlas después como energía. Niveles elevados suelen relacionarse con la alimentación, el consumo de alcohol, el sobrepeso o el sedentarismo, y en conjunto con el colesterol se usan para estimar el riesgo cardiovascular."},
 {id:'creatinina', name:'Creatinina', category:'renal', unit:'mg/dL', aliases:['Creatinina Sérica'], ref:{M:{min:0.7,max:1.3}, F:{min:0.6,max:1.1}}, desc:"Producto de desecho muscular que los riñones filtran; indica su función.", descFull:"La creatinina es un producto de desecho que generan los músculos de forma constante y que los riñones se encargan de filtrar y eliminar por la orina. Por eso se usa como un indicador indirecto de qué tan bien están funcionando los riñones: niveles elevados pueden sugerir que están filtrando con menor eficiencia."},
 {id:'urea', name:'Urea', category:'renal', unit:'mg/dL', aliases:['BUN','Nitrógeno Ureico'], ref:{def:{min:15,max:45}}, desc:"Producto de desecho del metabolismo de proteínas, filtrado por los riñones.", descFull:"La urea (o BUN) es un producto de desecho que se genera cuando el cuerpo descompone proteínas, y que los riñones eliminan por la orina. Se evalúa junto con la creatinina para tener una visión más completa de la función renal; también puede variar con la hidratación y el consumo de proteínas."},
 {id:'acido_urico', name:'Ácido Úrico', category:'renal', unit:'mg/dL', aliases:['Uricemia'], ref:{M:{min:3.5,max:7.2}, F:{min:2.6,max:6.0}}, desc:"Producto de la descomposición de las purinas; en exceso puede relacionarse con la gota.", descFull:"El ácido úrico se produce cuando el cuerpo descompone las purinas, presentes en ciertos alimentos y en las propias células. Niveles elevados de forma sostenida pueden favorecer la formación de cristales en las articulaciones (relacionados con la gota) o de cálculos renales, aunque muchas personas con valores altos nunca desarrollan síntomas."},
 {id:'tgo_ast', name:'TGO / AST', category:'hepatica', unit:'U/L', aliases:['AST','TGO','GOT'], ref:{def:{min:5,max:40}}, desc:"Enzima presente en el hígado y los músculos; su elevación sugiere daño celular.", descFull:"La AST (o TGO) es una enzima presente principalmente en el hígado, pero también en el corazón y los músculos. Se libera a la sangre cuando estas células se dañan, por lo que niveles elevados pueden reflejar inflamación o daño hepático, aunque también pueden subir por ejercicio intenso o afecciones musculares."},
 {id:'tgp_alt', name:'TGP / ALT', category:'hepatica', unit:'U/L', aliases:['ALT','TGP','GPT'], ref:{def:{min:7,max:56}}, desc:"Enzima hepática más específica del hígado que la AST.", descFull:"La ALT (o TGP) es una enzima que se encuentra sobre todo en las células del hígado, por lo que se considera un marcador más específico de la salud hepática que la AST. Niveles elevados suelen indicar que las células del hígado están inflamadas o dañadas, por ejemplo por el consumo de alcohol, ciertos medicamentos, el sobrepeso o infecciones virales."},
 {id:'bilirrubina_total', name:'Bilirrubina Total', category:'hepatica', unit:'mg/dL', aliases:['Bilirrubina'], ref:{def:{min:0.2,max:1.2}}, desc:"Pigmento producido al reciclar glóbulos rojos viejos; procesado por el hígado.", descFull:"La bilirrubina es un pigmento amarillento que se genera cuando el cuerpo recicla glóbulos rojos viejos, y que el hígado procesa para eliminarla por la bilis. Niveles elevados pueden reflejar problemas en el hígado, en las vías biliares o una mayor destrucción de glóbulos rojos, y en casos marcados pueden manifestarse como un tono amarillento en la piel o los ojos (ictericia)."},
 {id:'fosfatasa_alcalina', name:'Fosfatasa Alcalina', category:'hepatica', unit:'U/L', aliases:['ALP','Fosfatasa Alk.'], ref:{def:{min:44,max:147}}, desc:"Enzima presente en el hígado y los huesos; útil para evaluar ambos sistemas.", descFull:"La fosfatasa alcalina es una enzima que se encuentra principalmente en el hígado y en los huesos. Niveles elevados pueden relacionarse con condiciones que afectan las vías biliares o el hígado, o con procesos de formación ósea (incluyendo el crecimiento normal en niños y adolescentes), por lo que suele interpretarse junto con otros marcadores hepáticos."},
 {id:'gamma_gt', name:'Gamma GT', category:'hepatica', unit:'U/L', aliases:['GGT','Gamma-Glutamil Transferasa','Gamma Glutamil Transpeptidasa'], ref:{def:{min:10,max:47}}, desc:"Enzima hepática sensible al consumo de alcohol y a la obstrucción de las vías biliares.", descFull:"La Gamma GT (o GGT) es una enzima que se produce principalmente en el hígado y las vías biliares. Es especialmente sensible al consumo de alcohol y a ciertos medicamentos, y suele pedirse junto con TGO/AST y TGP/ALT para tener una visión más completa de la salud del hígado. Una elevación sostenida en el tiempo vale la pena comentarla con un médico."},
 {id:'apolipoproteina_a', name:'Apolipoproteína A', category:'lipidico', unit:'g/L', aliases:['Apo A','ApoA1','Apolipoproteina A1','Apolipoproteína A1'], ref:{def:{min:1.08,max:2.25}}, desc:"Componente principal del HDL ('colesterol bueno').", descFull:"La apolipoproteína A es el principal componente proteico del HDL, el llamado 'colesterol bueno'. Se usa, junto con la Apolipoproteína B, como una medida complementaria al perfil lipídico tradicional para estimar el riesgo cardiovascular: en general, valores más altos de Apo A se consideran favorables."},
 {id:'apolipoproteina_b', name:'Apolipoproteína B', category:'lipidico', unit:'g/L', aliases:['Apo B'], ref:{def:{min:0.60,max:1.55}}, desc:"Componente principal del LDL ('colesterol malo').", descFull:"La apolipoproteína B es el principal componente proteico del LDL y otras partículas asociadas al 'colesterol malo'. Algunos estudios sugieren que puede reflejar el riesgo cardiovascular incluso mejor que el LDL solo, ya que cada partícula de LDL contiene exactamente una molécula de Apo B. Se interpreta junto con el resto del perfil lipídico."},
 {id:'glucosa', name:'Glucosa', category:'metabolismo', unit:'mg/dL', aliases:['Glucosa en Ayunas','Glucosa Basal','Glicemia','Glucosa Basal en Ayunas'], ref:{def:{min:70,max:100}}, desc:"Nivel de azúcar en sangre; indicador central del metabolismo.", descFull:"La glucosa es el principal azúcar que circula en la sangre y la fuente de energía más importante para las células del cuerpo. Medida en ayunas, es uno de los indicadores centrales para evaluar el metabolismo: valores elevados de forma sostenida se asocian con prediabetes o diabetes, mientras que valores muy bajos pueden causar síntomas como mareo o debilidad."},
 {id:'hba1c', name:'Hemoglobina Glicosilada', category:'metabolismo', unit:'%', aliases:['HbA1c','A1c','Hemoglobina A1c','Hemoglobina Glicada'], ref:{def:{min:null,max:5.7}}, desc:"Refleja el promedio de glucosa en sangre de los últimos 2-3 meses.", descFull:"La hemoglobina glicosilada (HbA1c) mide qué porcentaje de la hemoglobina tiene glucosa adherida, lo que refleja el promedio de los niveles de azúcar en sangre durante los últimos dos o tres meses aproximadamente. Por eso se usa como un indicador de control metabólico a mediano plazo, complementario a la glucosa en ayunas, que solo muestra un momento puntual."},
 {id:'insulina', name:'Insulina', category:'metabolismo', unit:'µU/mL', aliases:['Insulina Basal'], ref:{def:{min:2.6,max:24.9}}, desc:"Hormona que regula cuánta glucosa entra a las células.", descFull:"La insulina es la hormona que produce el páncreas para permitir que la glucosa entre a las células y se use como energía. Medirla junto con la glucosa ayuda a evaluar qué tan eficientemente la está usando el cuerpo; niveles elevados en ayunas pueden ser un signo temprano de resistencia a la insulina."},
 {id:'tsh', name:'TSH', category:'tiroides', unit:'µUI/mL', aliases:['Hormona Estimulante de Tiroides'], ref:{def:{min:0.4,max:4.0}}, desc:"Hormona que regula la actividad de la tiroides; el examen más común para evaluarla.", descFull:"La TSH (hormona estimulante de la tiroides) es producida por la glándula pituitaria y le indica a la tiroides cuánta hormona tiroidea debe producir. Es el examen más usado para detectar problemas de tiroides: valores elevados suelen sugerir una tiroides poco activa (hipotiroidismo), mientras que valores bajos pueden sugerir una tiroides hiperactiva (hipertiroidismo)."},
 {id:'t3', name:'T3 Libre', category:'tiroides', unit:'pg/mL', aliases:['T3','Triyodotironina Libre'], ref:{def:{min:2.3,max:4.2}}, desc:"Una de las principales hormonas activas producidas por la tiroides.", descFull:"La T3 libre es una de las hormonas activas que produce la tiroides y que regula el metabolismo del cuerpo. Se suele medir junto con la TSH y la T4 cuando hay sospecha de un problema tiroideo, para entender mejor si la glándula está funcionando por encima o por debajo de lo esperado."},
 {id:'t4', name:'T4 Libre', category:'tiroides', unit:'ng/dL', aliases:['T4','Tiroxina Libre'], ref:{def:{min:0.8,max:1.8}}, desc:"Principal hormona producida por la tiroides; se convierte en T3 en los tejidos.", descFull:"La T4 libre es la hormona que produce en mayor cantidad la tiroides, y que luego el cuerpo transforma en T3 (la forma más activa) en distintos tejidos. Junto con la TSH, ayuda a determinar si la tiroides está funcionando de manera adecuada, hipoactiva o hiperactiva."},
 {id:'vitamina_d', name:'Vitamina D', category:'vitaminas', unit:'ng/mL', aliases:['25-OH Vitamina D','Vitamina D3'], ref:{def:{min:30,max:100}}, desc:"Vitamina clave para la salud ósea y el sistema inmune; se sintetiza con el sol.", descFull:"La vitamina D es fundamental para que el cuerpo absorba el calcio y mantenga los huesos sanos, además de participar en el sistema inmune. Se obtiene principalmente por la exposición a la luz solar y, en menor medida, de algunos alimentos, por lo que sus niveles suelen ser bajos en personas con poca exposición al sol o ciertas dietas."},
 {id:'vitamina_b12', name:'Vitamina B12', category:'vitaminas', unit:'pg/mL', aliases:['B12','Cobalamina'], ref:{def:{min:200,max:900}}, desc:"Vitamina esencial para la formación de glóbulos rojos y el sistema nervioso.", descFull:"La vitamina B12 es necesaria para producir glóbulos rojos sanos y para el correcto funcionamiento del sistema nervioso. Se obtiene principalmente de alimentos de origen animal, por lo que niveles bajos son más frecuentes en dietas vegetarianas o veganas estrictas, o en personas con dificultad para absorberla."},
 {id:'hierro', name:'Hierro', category:'vitaminas', unit:'µg/dL', aliases:['Fe','Hierro Sérico'], ref:{M:{min:65,max:175}, F:{min:50,max:170}}, desc:"Mineral esencial para producir hemoglobina y transportar oxígeno.", descFull:"El hierro es un mineral esencial para producir hemoglobina, la proteína que transporta oxígeno en la sangre. Niveles bajos pueden estar relacionados con anemia por deficiencia de hierro, mientras que niveles muy altos pueden asociarse con una sobrecarga de hierro en el cuerpo."},
 {id:'ferritina', name:'Ferritina', category:'vitaminas', unit:'ng/mL', aliases:[], ref:{M:{min:24,max:336}, F:{min:11,max:307}}, desc:"Proteína que almacena hierro; refleja las reservas de hierro del cuerpo.", descFull:"La ferritina es la proteína que almacena el hierro dentro de las células, por lo que sus niveles reflejan cuánto hierro tiene guardado el cuerpo como reserva. Es uno de los primeros valores en bajar cuando comienza una deficiencia de hierro, incluso antes de que la hemoglobina se vea afectada."},
 {id:'calcio', name:'Calcio', category:'vitaminas', unit:'mg/dL', aliases:['Ca','Calcio Sérico'], ref:{def:{min:8.5,max:10.5}}, desc:"Mineral esencial para huesos, músculos y la función nerviosa.", descFull:"El calcio es un mineral esencial para la formación de huesos y dientes, la contracción muscular y la transmisión de señales nerviosas. Su nivel en sangre está regulado de forma muy estricta por el cuerpo (con ayuda de la vitamina D y otras hormonas), por lo que las alteraciones pueden reflejar problemas óseos, renales o de las glándulas paratiroides, entre otras causas."},
 {id:'acido_folico', name:'Ácido Fólico', category:'vitaminas', unit:'ng/mL', aliases:['Folato','Ácido Fólico (Determinación)','Folic Acid'], ref:{def:{min:4.6,max:34.8}}, desc:"Vitamina del grupo B necesaria para producir glóbulos rojos nuevos.", descFull:"El ácido fólico (o folato) es una vitamina del grupo B esencial para producir células nuevas, especialmente glóbulos rojos, y suele medirse junto con la vitamina B12 al estudiar una anemia. Niveles bajos pueden relacionarse con una alimentación pobre en vegetales de hoja verde, ciertos medicamentos o problemas de absorción intestinal."},
 {id:'sodio', name:'Sodio', category:'electrolitos', unit:'mmol/L', aliases:['Na','Sodio en Suero','Sodio Sérico'], ref:{def:{min:136,max:145}}, desc:"Electrolito clave para el equilibrio de líquidos y la función nerviosa.", descFull:"El sodio es el principal electrolito del líquido fuera de las células y ayuda a regular el equilibrio de agua en el cuerpo, la presión arterial y la transmisión de impulsos nerviosos. Sus niveles pueden alterarse por deshidratación, exceso de líquidos, ciertos medicamentos (como diuréticos) o problemas renales, hormonales o cardíacos."},
 {id:'potasio', name:'Potasio', category:'electrolitos', unit:'mmol/L', aliases:['K','Potasio Sérico'], ref:{def:{min:3.5,max:5.1}}, desc:"Electrolito esencial para el funcionamiento del corazón y los músculos.", descFull:"El potasio es fundamental para que el corazón y los músculos funcionen con normalidad, y trabaja de la mano con el sodio para mantener el equilibrio eléctrico de las células. Tanto niveles muy bajos como muy altos pueden afectar el ritmo cardíaco, por lo que suele vigilarse de cerca, especialmente en personas que toman medicamentos para la presión o los riñones."},
 {id:'cloro', name:'Cloro', category:'electrolitos', unit:'mmol/L', aliases:['Cl','Cloro Sérico'], ref:{def:{min:98,max:107}}, desc:"Electrolito que trabaja junto al sodio para mantener el equilibrio de líquidos.", descFull:"El cloro es un electrolito que suele variar en la misma dirección que el sodio y ayuda a mantener el equilibrio de líquidos, el volumen de sangre y el balance ácido-base del cuerpo. Se interpreta casi siempre junto con el sodio y el potasio, más que de forma aislada."},
 {id:'magnesio', name:'Magnesio', category:'electrolitos', unit:'mg/dL', aliases:['Magnesio Sérico','Magnesemia'], ref:{def:{min:1.58,max:2.55}}, desc:"Mineral involucrado en cientos de procesos, incluyendo la función muscular y cardíaca.", descFull:"El magnesio participa en cientos de reacciones del cuerpo, incluyendo la función muscular, nerviosa y cardíaca, y la regulación de otros electrolitos como el potasio y el calcio. Niveles bajos pueden relacionarse con la alimentación, ciertos medicamentos o pérdidas digestivas o renales."},
 {id:'psa', name:'PSA (Antígeno Prostático)', category:'otros', unit:'ng/mL', aliases:['Antígeno Prostático Específico','PSA Total','Prostate-Specific Antigen'], ref:{M:{min:0,max:4.0}}, desc:"Proteína producida por la próstata; se usa en la evaluación de la salud prostática en hombres.", descFull:"El PSA (antígeno prostático específico) es una proteína producida por la próstata que puede elevarse por distintas razones: el crecimiento benigno de la próstata (algo común con la edad), inflamación o infección, y con menor frecuencia cáncer de próstata. Un valor elevado no es por sí mismo un diagnóstico — suele requerir seguimiento en el tiempo y, según el caso, estudios adicionales interpretados por un urólogo."}
];

function calcAge(birthDate){
  var b = new Date(birthDate+'T00:00:00');
  var now = new Date();
  var age = now.getFullYear() - b.getFullYear();
  var m = now.getMonth() - b.getMonth();
  if(m < 0 || (m===0 && now.getDate() < b.getDate())) age--;
  return age;
}

  var meses = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

   ========================================================= */
function resolveRef(indicatorId, sex, examOverride){
  /* Prioridad 1: rango indicado en el resultado del laboratorio (examOverride) */
  if(examOverride && (examOverride.min!==undefined || examOverride.max!==undefined)){
    return {min: examOverride.min===undefined?null:examOverride.min, max: examOverride.max===undefined?null:examOverride.max, source:'laboratorio'};
  }
  var ind = indicatorById(indicatorId);
  if(!ind) return {min:null, max:null, source:'desconocido'};
  /* Prioridad 2/3: base de conocimiento general, ajustada por sexo cuando aplica */
  var r = ind.ref[sex] || ind.ref.def || ind.ref.M || ind.ref.F;
  if(!r) return {min:null, max:null, source:'sin-dato'};
  return {min: r.min===undefined?null:r.min, max: r.max===undefined?null:r.max, source:'referencia-general'};
}

  seguimiento:{label:'Para seguimiento', shortLabel:'Seguimiento', pill:'pill-watch', color:'var(--watch)'},

  atencion:{label:'Atención prioritaria', shortLabel:'Atención', pill:'pill-alert', color:'var(--alert)'},

function classifyPoint(value, ref, historyAsc, trendInfo){
  if(ref.min===null && ref.max===null) return 'sinrango';
  var inRange = (ref.min===null || value>=ref.min) && (ref.max===null || value<=ref.max);
  if(inRange){
    var near = false;
    if(ref.min!==null && ref.max!==null){
      var width = ref.max-ref.min;
      var distEdge = Math.min(value-ref.min, ref.max-value);
      near = width>0 && (distEdge <= width*0.08);
    } else if(ref.max!==null){
      near = (ref.max-value) <= Math.abs(ref.max*0.06);
    } else if(ref.min!==null){
      near = (value-ref.min) <= Math.abs(ref.min*0.10);
    }
    if(near) return 'seguimiento';
    if(trendInfo && trendInfo.direction==='ascendente' && ref.max!==null && (ref.max-value) <= (ref.max-ref.min===undefined?ref.max*0.15:(ref.max-ref.min)*0.18)) return 'seguimiento';
    return 'optimo';
  } else {
    var last4 = historyAsc.slice(-4);
    var outCount = last4.filter(function(p){ return (ref.min!==null && p.value<ref.min) || (ref.max!==null && p.value>ref.max); }).length;
    var magnitude = 0;
    if(ref.max!==null && value>ref.max){ magnitude = (value-ref.max) / (ref.max || 1); }
    if(ref.min!==null && value<ref.min){ magnitude = (ref.min-value) / (ref.min || 1); }
    if(outCount>=3 || magnitude>0.30) return 'atencion';
    return 'fuera';
  }
}

/* =========================================================
   8. MOTOR: TENDENCIAS
   ========================================================= */
function computeTrend(historyAsc){
  var pts = historyAsc.slice(-4);
  if(pts.length < 2) return {direction:'insuficiente', pctVsPrev:null, pctVsFirst:null};
  var vals = pts.map(function(p){ return p.value; });
  var diffs = [];
  for(var i=1;i<vals.length;i++) diffs.push(vals[i]-vals[i-1]);
  var first = vals[0], last = vals[vals.length-1];
  var relSpan = first!==0 ? (last-first)/Math.abs(first) : 0;
  var allNonNeg = diffs.every(function(d){ return d>=-1e-9; });
  var allNonPos = diffs.every(function(d){ return d<=1e-9; });
  var mean = vals.reduce(function(a,b){return a+b;},0)/vals.length;
  var variance = vals.reduce(function(a,b){return a+Math.pow(b-mean,2);},0)/vals.length;
  var cv = mean!==0 ? Math.sqrt(variance)/Math.abs(mean) : 0;
  var direction;
  if(allNonNeg && relSpan >= 0.04) direction = 'ascendente';
  else if(allNonPos && relSpan <= -0.04) direction = 'descendente';
  else if(cv < 0.045) direction = 'estable';
  else direction = 'variable';
  var prev = vals.length>=2 ? vals[vals.length-2] : null;
  var pctVsPrev = (prev!==null && prev!==0) ? ((last-prev)/Math.abs(prev))*100 : null;
  var pctVsFirst = (first!==0) ? ((last-first)/Math.abs(first))*100 : null;
  return {direction:direction, pctVsPrev:pctVsPrev, pctVsFirst:pctVsFirst};
}

/* =========================================================
   9. MOTOR: RESUMEN POR MIEMBRO (clasificación + tendencias por indicador)
   ========================================================= */
function memberIndicatorSummaries(memberId){
  var m = memberById(memberId);
  var ids = allIndicatorIdsForMember(memberId);
  return ids.map(function(indId){
    var hist = indicatorHistory(memberId, indId);
    var ref = resolveRef(indId, m.sex, null);
    var trend = computeTrend(hist);
    var last = hist[hist.length-1];
    var level = classifyPoint(last.value, ref, hist, trend);
    var histVals = hist.map(function(p){return p.value;});
    return {
      indicatorId:indId, indicator:indicatorById(indId), member:m, ref:ref, trend:trend,
      history:hist, level:level, lastValue:last.value, lastDate:last.date, lastExamId:last.examId,
      min:Math.min.apply(null,histVals), max:Math.max.apply(null,histVals),
      avg: histVals.reduce(function(a,b){return a+b;},0)/histVals.length,
      isNew: hist.length===1
    };
  }).sort(function(a,b){ return a.indicator.name.localeCompare(b.indicator.name); });
}

function levelCounts(summaries){
  var c = {optimo:0, seguimiento:0, fuera:0, atencion:0, sinrango:0};
  summaries.forEach(function(s){ c[s.level] = (c[s.level]||0)+1; });
  return c;
}

/* =========================================================
   10. MOTOR: HEALTH SCORE (transparente)
   ========================================================= */
function computeHealthScore(memberId){
  var sums = memberIndicatorSummaries(memberId).filter(function(s){ return s.level!=='sinrango'; });
  if(sums.length===0) return {score:null, breakdown:null};
  var total = sums.length;
  var optimo = sums.filter(function(s){return s.level==='optimo';}).length;
  var seguimiento = sums.filter(function(s){return s.level==='seguimiento';}).length;
  var fuera = sums.filter(function(s){return s.level==='fuera';}).length;
  var atencion = sums.filter(function(s){return s.level==='atencion';}).length;
  var base = (optimo/total)*70;
  var estables = sums.filter(function(s){ return s.trend.direction==='estable' && (s.level==='optimo'||s.level==='seguimiento'); }).length;
  var stabilityBonus = (estables/total)*15;
  var persistencePenalty = Math.min(20, atencion*7 + fuera*3);
  var variabilityPenalty = Math.min(8, sums.filter(function(s){return s.trend.direction==='variable';}).length*1.5);
  var raw = base + stabilityBonus - persistencePenalty - variabilityPenalty;
  var score = Math.max(0, Math.min(100, Math.round(raw)));
  var band = score>=80?'Estable':(score>=60?'Aceptable':(score>=40?'Para seguimiento':'Requiere atención'));
  var bandIcon = score>=80?'🟢':(score>=60?'🟢':(score>=40?'🟡':'🟠'));
  return {score:score, band:band, bandIcon:bandIcon, breakdown:{total:total, optimo:optimo, seguimiento:seguimiento, fuera:fuera, atencion:atencion, base:base, stabilityBonus:stabilityBonus, persistencePenalty:persistencePenalty, variabilityPenalty:variabilityPenalty}};
}

/* =========================================================
   11. MOTOR: ALERTAS INTELIGENTES
   ========================================================= */
function memberAlerts(memberId){
  var sums = memberIndicatorSummaries(memberId);
  var alerts = [];
  sums.forEach(function(s){
    if((s.trend.direction==='ascendente' || s.trend.direction==='descendente') && s.history.length>=3 && s.level!=='optimo'){
      alerts.push({type:'tendencia', indicator:s.indicator.name, indicatorId:s.indicatorId,
        text:'Se observa una tendencia '+s.trend.direction+' en '+s.indicator.name.toLowerCase()+' durante los últimos controles. La interpretación de este comportamiento depende del contexto clínico; puede ser útil comentarlo en tu próxima consulta.'});
    }
    var last4 = s.history.slice(-4);
    var outCount = last4.filter(function(p){ return (s.ref.min!==null && p.value<s.ref.min) || (s.ref.max!==null && p.value>s.ref.max); }).length;
    if(outCount>=2 && s.ref.max!==null || s.ref.min!==null){
      if(outCount>=2){
        alerts.push({type:'persistencia', indicator:s.indicator.name, indicatorId:s.indicatorId,
          text:'Este indicador ha estado fuera del rango de referencia en '+outCount+' de los últimos '+last4.length+' exámenes registrados. Se recomienda comentar esta evolución con un profesional de salud.'});
      }
    }
    if(s.trend.pctVsPrev!==null && Math.abs(s.trend.pctVsPrev) >= 20){
      alerts.push({type:'variabilidad', indicator:s.indicator.name, indicatorId:s.indicatorId,
        text:'Se observa una variación de '+(s.trend.pctVsPrev>0?'+':'')+s.trend.pctVsPrev.toFixed(1)+'% respecto al resultado anterior. La interpretación de este cambio debe considerar el contexto clínico, las condiciones del examen y la metodología utilizada.'});
    }
  });
  return alerts;
}

/* =========================================================
   12. MOTOR: INSIGHTS AUTOMÁTICOS
   ========================================================= */
function memberInsights(memberId){
  var sums = memberIndicatorSummaries(memberId);
  var out = [];
  sums.forEach(function(s){
    var name = s.indicator.name;
    if(s.isNew){
      out.push({icon:'🆕', tag:'Nuevo registro', weight:2, date:s.lastDate,
        text:'Se identificó un nuevo indicador registrado por primera vez: '+name+' ('+fmtNum(s.lastValue)+' '+s.indicator.unit+').'});
      return;
    }
    if(s.trend.direction==='ascendente' || s.trend.direction==='descendente'){
      var favorable = null;
      if(s.ref.max!==null && s.ref.min===null) favorable = s.trend.direction==='descendente';
      else if(s.ref.min!==null && s.ref.max===null) favorable = s.trend.direction==='ascendente';
      var tono = favorable===true ? 'Tendencia positiva' : (favorable===false ? 'Seguimiento recomendado' : 'Tendencia detectada');
      var icon = favorable===true?'📈':(favorable===false?'⚠️':(s.trend.direction==='ascendente'?'📈':'📉'));
      var pct = s.trend.pctVsFirst!==null ? Math.abs(s.trend.pctVsFirst).toFixed(0)+'%' : null;
      out.push({icon:icon, tag:tono, weight: favorable!==null?3:1.5, date:s.lastDate,
        text: name+' ha mostrado una tendencia '+s.trend.direction+' en los últimos '+s.history.slice(-4).length+' controles'+(pct?(' ('+pct+' desde el primer valor registrado en este periodo)'):'')+'. La interpretación depende del contexto clínico; puede ser útil mantener seguimiento.'});
    } else if(s.trend.direction==='estable' && s.history.length>=3){
      out.push({icon:'📊', tag:'Indicador estable', weight:1, date:s.lastDate,
        text: name+' se ha mantenido estable durante los últimos '+s.history.length+' controles registrados.'});
    }
    if(s.trend.pctVsPrev!==null && Math.abs(s.trend.pctVsPrev)>=15){
      out.push({icon:'🔁', tag:'Cambio relevante', weight:2.2, date:s.lastDate,
        text: 'El resultado de '+name+' presenta una variación del '+Math.abs(s.trend.pctVsPrev).toFixed(0)+'% respecto al examen anterior.'});
    }
    if(s.lastValue===s.max && s.history.length>=3 && ((s.ref.max!==null && s.lastValue>=s.ref.max*0.9))){
      out.push({icon:'🔺', tag:'Valor destacado', weight:1.8, date:s.lastDate, text:'El resultado actual de '+name+' es el valor más alto registrado en su historial.'});
    }
    if(s.lastValue===s.min && s.history.length>=3 && s.ref.min!==null && s.lastValue<=s.ref.min*1.15){
      out.push({icon:'🔻', tag:'Valor destacado', weight:1.5, date:s.lastDate, text:'El resultado actual de '+name+' es el valor más bajo registrado en su historial.'});
    }
    var last4 = s.history.slice(-4);
    if(last4.length>=2){
      var prevOut = (s.ref.min!==null && last4[last4.length-2].value<s.ref.min) || (s.ref.max!==null && last4[last4.length-2].value>s.ref.max);
      var nowIn = s.level==='optimo' || s.level==='seguimiento';
      if(prevOut && nowIn){
        out.push({icon:'✅', tag:'Regreso al rango', weight:2.5, date:s.lastDate, text: name+' regresó al rango de referencia después de haber estado fuera en el control anterior.'});
      }
    }
    var outCount = last4.filter(function(p){ return (s.ref.min!==null && p.value<s.ref.min) || (s.ref.max!==null && p.value>s.ref.max); }).length;
    if(outCount>=3){
      out.push({icon:'👁️', tag:'Seguimiento', weight:3, date:s.lastDate, text: name+' ha estado fuera del rango de referencia en '+outCount+' de los últimos '+last4.length+' exámenes. Se recomienda monitorear su evolución en futuros controles.'});
    }
  });
  out.sort(function(a,b){ return b.weight-a.weight || (a.date<b.date?1:-1); });
  return out;
}

function topInsightsAcrossFamily(limit){
  var all = [];
  MEMBERS.forEach(function(m){
    memberInsights(m.id).forEach(function(ins){ all.push(Object.assign({}, ins, {memberId:m.id, memberName:m.name})); });
  });
  all.sort(function(a,b){ return b.weight-a.weight || (a.date<b.date?1:-1); });
  return all.slice(0, limit||5);
}

   13. UI: helpers de presentación
   ========================================================= */
function pillHtml(level, extra){
  var meta = LEVEL_META[level];
  var label = (extra&&extra.text) ? extra.text : ((extra&&extra.short) ? meta.shortLabel : meta.label);
  return '<span class="pill '+meta.pill+'" style="white-space:nowrap;">'+(extra&&extra.icon?extra.icon:'<span class="pill-dot"></span>')+' '+label+'</span>';
}
function refText(ref, unit){
  if(ref.min===null && ref.max===null) return 'Sin rango de referencia';
  if(ref.min!==null && ref.max!==null) return ref.min+' – '+ref.max+' '+unit;
  if(ref.max!==null) return '&lt; '+ref.max+' '+unit;
  return '&gt; '+ref.min+' '+unit;
}

function svgLineChart(hist, ref, opts){
  opts = opts||{};
  var w = opts.width||640, h = opts.height||220;
  var unit = opts.unit||'';
  var detailed = opts.detailed!==undefined ? opts.detailed : (h>=200);
  var padL = detailed?54:20, padR=18, padT= detailed?30:14, padB= detailed?32:18;
  var innerW=w-padL-padR, innerH=h-padT-padB;
  if(!hist.length) return '<div class="empty-state">Sin datos suficientes para graficar.</div>';
  var values = hist.map(function(p){return p.value;});
  var lo = Math.min.apply(null, values.concat(ref.min!==null?[ref.min]:[]));
  var hi = Math.max.apply(null, values.concat(ref.max!==null?[ref.max]:[]));
  var span = hi-lo; if(span<=0) span=Math.max(1,hi*0.2||1);
  var padSpan = span*0.2;
  lo -= padSpan; hi += padSpan;
  function xFor(i){ return padL + (hist.length===1?innerW/2:(innerW*i/(hist.length-1))); }
  function yFor(v){ return padT + innerH - ((v-lo)/(hi-lo))*innerH; }

  var bandRectSvg='';
  if(ref.min!==null || ref.max!==null){
    var yTop = ref.max!==null? yFor(ref.max): padT;
    var yBot = ref.min!==null? yFor(ref.min): padT+innerH;
    bandRectSvg = '<rect x="'+padL+'" y="'+yTop+'" width="'+innerW+'" height="'+Math.max(0,yBot-yTop)+'" fill="var(--accent-soft)" opacity="0.6" rx="4"></rect>'+
      (detailed ? '<text x="'+(padL+innerW-4)+'" y="'+(yTop+12)+'" font-size="10" text-anchor="end" fill="var(--accent)" font-weight="700">rango esperado</text>' : '');
  }

  /* Grilla horizontal (hairline, recesiva) +, en vista detallada, sus valores en el eje Y
     para que el lector tenga referencia numérica sin necesidad de una etiqueta por punto. */
  var gridSvg='', yTicksSvg='';
  for(var g=0; g<=2; g++){
    var gy = padT + innerH*g/2;
    gridSvg += '<line x1="'+padL+'" y1="'+gy+'" x2="'+(padL+innerW)+'" y2="'+gy+'" stroke="var(--border)" stroke-width="1"></line>';
    if(detailed){
      var tickVal = hi - (hi-lo)*g/2;
      yTicksSvg += '<text x="'+(padL-8)+'" y="'+(gy+3.5)+'" font-size="10" text-anchor="end" fill="var(--ink-3)">'+fmtNum(tickVal)+'</text>';
    }
  }

  /* Color = estado, no identidad: cada punto se clasifica (dentro de rango / cerca del
     límite / fuera de rango / atención prioritaria) con el mismo motor que ya usan los
     pills y los Insights, y ese color pinta el punto, el tramo de línea que llega a él
     y su franja de área — así el óptimo se ve verde y lo fuera de rango se ve rojo/
     naranja de un vistazo, sin tener que leer cada cifra. */
  var levels = hist.map(function(p,i){ return classifyPoint(p.value, ref, hist.slice(0,i+1), computeTrend(hist.slice(0,i+1))); });

  var lineSegSvg='', areaSvg='';
  for(var i=0;i<hist.length-1;i++){
    var x1=xFor(i), y1=yFor(hist[i].value), x2=xFor(i+1), y2=yFor(hist[i+1].value);
    var segColor = LEVEL_META[levels[i+1]].color;
    lineSegSvg += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+segColor+'" stroke-width="2" stroke-linecap="round"></line>';
    if(detailed){
      areaSvg += '<path d="M '+x1+' '+y1+' L '+x2+' '+y2+' L '+x2+' '+(padT+innerH)+' L '+x1+' '+(padT+innerH)+' Z" fill="'+segColor+'" fill-opacity="0.09" stroke="none"></path>';
    }
  }

  /* Etiquetado selectivo: nunca un número sobre cada punto. Solo se marca el último
     resultado (el que importa hoy) y, cuando hay suficiente historial, el máximo y el
     mínimo histórico del periodo mostrado. El resto del detalle queda en los ticks del
     eje Y, en el tooltip al pasar el cursor y en la tabla de historial completo. */
  var maxIdx=0, minIdx=0;
  hist.forEach(function(p,i){ if(p.value>hist[maxIdx].value) maxIdx=i; if(p.value<hist[minIdx].value) minIdx=i; });
  var lastIdx = hist.length-1;
  var markExtremes = detailed && hist.length>=3;

  var dotsSvg='', labelsSvg='', hitSvg='';
  hist.forEach(function(p,i){
    var isLast = i===lastIdx;
    var isExtreme = markExtremes && (i===maxIdx || i===minIdx) && !isLast;
    var r = isLast? 6:4;
    var lvl = levels[i];
    var col = LEVEL_META[lvl].color;
    var cx = xFor(i), cy = yFor(p.value);
    dotsSvg += '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+col+'" stroke="var(--surface)" stroke-width="2"></circle>';
    if(isLast || isExtreme){
      var above = isLast ? true : (i===minIdx && i!==maxIdx ? false : true);
      var dy = above ? -(isLast?15:11) : 17;
      labelsSvg += '<text x="'+cx+'" y="'+(cy+dy)+'" font-size="'+(isLast?12.5:10.5)+'" text-anchor="middle" fill="'+(isLast?'var(--ink)':'var(--ink-2)')+'" font-weight="'+(isLast?700:600)+'">'+fmtNum(p.value)+'</text>';
    }
    if(detailed){
      hitSvg += '<circle cx="'+cx+'" cy="'+cy+'" r="14" fill="transparent" tabindex="0" style="cursor:pointer;outline:none;" '+
        'data-date="'+escapeHtml(fmtDate(p.date))+'" data-value="'+escapeHtml(fmtNum(p.value))+'" data-unit="'+escapeHtml(unit)+'" data-level="'+escapeHtml(LEVEL_META[lvl].shortLabel)+'" '+
        'onmouseenter="App.chartTip(event,this)" onmousemove="App.chartTip(event,this)" onmouseleave="App.hideChartTip()" '+
        'onfocus="App.chartTip(event,this)" onblur="App.hideChartTip()"></circle>';
    }
  });

  var xLabels = hist.map(function(p,i){
    if(hist.length>6 && i%2===1 && i!==hist.length-1) return '';
    return '<text x="'+xFor(i)+'" y="'+(h-8)+'" font-size="10" text-anchor="middle" fill="var(--ink-3)">'+fmtDateAxis(p.date)+'</text>';
  }).join('');

  var svg = '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Gráfico de evolución, coloreado según si cada resultado está dentro o fuera del rango de referencia">'+
    gridSvg+yTicksSvg+bandRectSvg+areaSvg+lineSegSvg+
    dotsSvg+labelsSvg+xLabels+hitSvg+'</svg>';

  /* El color ahora es de ESTADO (no de identidad de serie), así que —como pide la guía
     de visualización— nunca va solo: siempre viaja con un punto de color + una etiqueta
     de texto en una leyenda, y solo se listan los estados que de verdad aparecen en el
     historial mostrado. */
  var legendHtml = '';
  if(detailed){
    var order = ['optimo','seguimiento','fuera','atencion','sinrango'];
    var present = order.filter(function(lv){ return levels.indexOf(lv)>-1; });
    if(present.length>1 || (present.length===1 && present[0]!=='optimo')){
      legendHtml = '<div class="chart-legend">'+present.map(function(lv){
        return '<span class="chart-legend-item"><span class="chart-legend-dot" style="background:'+LEVEL_META[lv].color+'"></span>'+LEVEL_META[lv].shortLabel+'</span>';
      }).join('')+'</div>';
    }
  }
  return svg + legendHtml;
}

function miniSparkline(hist, ref){
  return svgLineChart(hist, ref, {width:320, height:100, detailed:false});
}

/* Tooltip de gráficos: una sola capa flotante (#chart-tip) reutilizada por todos los
   gráficos "detallados". Los valores llegan por data-* (nunca por HTML embebido) y se
   insertan con textContent, para que el contenido nunca se interprete como marcado. */
function chartTipFn(evt, el){
  var tip = document.getElementById('chart-tip');
  if(!tip || !el) return;
  var value = el.getAttribute('data-value')||'';
  var unit = el.getAttribute('data-unit')||'';
  var date = el.getAttribute('data-date')||'';
  var level = el.getAttribute('data-level')||'';
  tip.innerHTML = '';
  var vEl = document.createElement('div');
  vEl.className = 'tip-val';
  vEl.textContent = value + (unit? (' '+unit) : '');
  var mEl = document.createElement('div');
  mEl.className = 'tip-meta';
  mEl.textContent = date + (level? (' · '+level) : '');
  tip.appendChild(vEl);
  tip.appendChild(mEl);
  var x = (evt && evt.clientX!==undefined) ? evt.clientX : 0;
  var y = (evt && evt.clientY!==undefined) ? evt.clientY : 0;
  tip.style.left = x+'px';
  tip.style.top = (y-4)+'px';
  tip.classList.add('show');
  tip.setAttribute('aria-hidden','false');
}
function hideChartTipFn(){
  var tip = document.getElementById('chart-tip');
  if(!tip) return;
  tip.classList.remove('show');
  tip.setAttribute('aria-hidden','true');
}

  var errEl = document.getElementById('am-error');
  if(errEl) errEl.textContent = '';
  if(!name || !birth){ if(errEl) errEl.textContent='Completa el nombre y la fecha de nacimiento.'; return; }
  var initials = name.split(' ').filter(Boolean).slice(0,2).map(function(w){return w[0];}).join('').toUpperCase();
  var palette = ['#1F6E64','#A9573F','#8C6D2F','#5C6BA0','#7A4E9E'];
  var hue = palette[Math.floor(Math.random()*palette.length)];
  var btn = e.target.querySelector('button[type=submit]');
  if(btn){ btn.disabled = true; btn.textContent = 'Agregando…'; }
  sb.from('members').insert({ name:name, role:role, birth_date:birth, sex:sex, initials:initials, hue:hue }).then(function(res){
    if(res.error) throw res.error;
    return loadFamilyData();
  }).then(function(){
    closeModalFn();
    renderApp();
  }).catch(function(err){
    if(errEl) errEl.textContent = 'No se pudo guardar: '+((err&&err.message)||'error de conexión');
    if(btn){ btn.disabled = false; btn.textContent = 'Agregar'; }
  });
}

function loadFamilyData(){
  return sb.from('members').select('*').then(function(res){
    if(res.error) throw res.error;
    var rows = res.data || [];
    MEMBERS.splice(0, MEMBERS.length);
    rows.forEach(function(r){
      MEMBERS.push({ id:r.id, name:r.name, role:r.role||'Miembro de la familia', birthDate:r.birth_date, sex:r.sex||'F',
        initials: r.initials || (r.name||'?').slice(0,2).toUpperCase(), hue: r.hue||'#1F6E64', userId:r.user_id });
    });
    return sb.from('exams').select('*').order('date', {ascending:true});
  }).then(function(res){
    if(res.error) throw res.error;
    var examRows = res.data || [];
    LIVE.examsByMember = {};
    examRows.forEach(function(e){
      (LIVE.examsByMember[e.member_id] = LIVE.examsByMember[e.member_id]||[]).push({
        id:e.id, memberId:e.member_id, date:e.date, lab:e.lab, name:e.name, pdfPath:e.pdf_path,
        uploadedAt:e.uploaded_at, source:'supabase', values:{}
      });
    });
    var examIds = examRows.map(function(e){ return e.id; });
    if(!examIds.length) return {data:[]};
    return sb.from('results').select('*').in('exam_id', examIds);
  }).then(function(res){
    if(res && res.error) throw res.error;
    var resultRows = (res && res.data) || [];
    var examById = {};
    Object.keys(LIVE.examsByMember).forEach(function(mid){ LIVE.examsByMember[mid].forEach(function(ex){ examById[ex.id]=ex; }); });
    resultRows.forEach(function(r){ var ex = examById[r.exam_id]; if(ex) ex.values[r.indicator_id] = Number(r.value); });
    LIVE.loaded = true;
  });
}

function examSummary(memberId, exam){
  var m = memberById(memberId);
  var ids = Object.keys(exam.values);
  var counts = {optimo:0,seguimiento:0,fuera:0,atencion:0,sinrango:0};
  ids.forEach(function(id){
    var fullHist = indicatorHistory(memberId, id).filter(function(p){ return p.date<=exam.date; });
    var ref = resolveRef(id, m.sex, null);
    var trend = computeTrend(fullHist);
    var lvl = classifyPoint(exam.values[id], ref, fullHist, trend);
    counts[lvl]=(counts[lvl]||0)+1;
  });
  return {total:ids.length, counts:counts};
}

function indicatorAppliesToSex(ind, sex){
  if(!ind.ref) return true;
  if(ind.ref[sex]) return true;
  if(ind.ref.def) return true;
  var keys = Object.keys(ind.ref);
  var isSexRestricted = (keys.indexOf('M')>-1 || keys.indexOf('F')>-1);
  return !isSexRestricted;
}

/* =========================================================
   19b. LECTURA REAL DE PDF (extracción de texto + emparejamiento)
   ========================================================= */
function stripAccents(s){
  return String(s||'')
    .replace(/[ÁÀÄÂÃ]/g,'A').replace(/[áàäâã]/g,'a')
    .replace(/[ÉÈËÊ]/g,'E').replace(/[éèëê]/g,'e')
    .replace(/[ÍÌÏÎ]/g,'I').replace(/[íìïî]/g,'i')
    .replace(/[ÓÒÖÔÕ]/g,'O').replace(/[óòöôõ]/g,'o')
    .replace(/[ÚÙÜÛ]/g,'U').replace(/[úùüû]/g,'u')
    .replace(/Ñ/g,'N').replace(/ñ/g,'n');
}
function normKey(s){ return stripAccents(s).toUpperCase(); }
function escapeRegexLiteral(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function aliasToRegex(alias){
  var norm = normKey(alias).trim();
  if(!norm) return null;
  var pat = escapeRegexLiteral(norm).replace(/\s+/g,'\\s+');
  var startsWord = /[A-Z0-9]/.test(norm.charAt(0));
  var endsWord = /[A-Z0-9]/.test(norm.charAt(norm.length-1));
  try{ return new RegExp((startsWord?'\\b':'')+pat+(endsWord?'\\b':'')); }
  catch(e){ return null; }
}
function buildIndicatorMatchers(sex){
  var list = [];
  INDICATORS.filter(function(ind){ return indicatorAppliesToSex(ind, sex); }).forEach(function(ind){
    var names = [ind.name].concat(ind.aliases||[]);
    names.forEach(function(n){
      var rx = aliasToRegex(n);
      if(!rx) return;
      list.push({ind:ind, alias:n, regex:rx, len:normKey(n).trim().length});
    });
  });
  list.sort(function(a,b){ return b.len-a.len; });
  return list;
}
function extractValueNear(line, matchEndIdx){
  var windowStr = line.substr(matchEndIdx, 80);
  /* Salta paréntesis pegados al nombre del indicador (ej. "(HbA1c)", "(25-OH)"):
     son parte del método/abreviatura, no el resultado. */
  windowStr = windowStr.replace(/^(\s*\([^)]*\)\s*)+/, ' ');
  /* Busca el primer número que esté "aislado" (sin letras pegadas antes o después).
     Esto evita capturar dígitos que en realidad son parte de un código o abreviatura,
     como el "1" de "HbA1c", el "25" de "25-OH" o el "3"/"4" de "T3"/"T4". */
  var isLetter = /[A-Za-zÁÉÍÓÚÑÜáéíóúñü]/;
  var re = /-?\d+(?:[.,]\d+)?/g;
  var m;
  while((m = re.exec(windowStr))){
    var before = m.index>0 ? windowStr.charAt(m.index-1) : '';
    var after = windowStr.charAt(m.index+m[0].length);
    if(isLetter.test(before) || isLetter.test(after)) continue;
    var val = parseFloat(m[0].replace(',','.'));
    if(!isNaN(val)) return val;
  }
  return null;
}
/* Extrae el texto de un PDF reconstruyendo líneas visuales a partir de las
   posiciones de cada fragmento de texto (necesario porque pdf.js entrega
   los fragmentos sueltos, no por línea). */
function extractPdfLines(file){
  return file.arrayBuffer().then(function(buf){
    return pdfjsLib.getDocument({data:buf}).promise;
  }).then(function(pdf){
    var pagePromises = [];
    for(var p=1;p<=pdf.numPages;p++){
      pagePromises.push(pdf.getPage(p).then(function(page){
        return page.getTextContent().then(function(content){
          var items = content.items.slice().sort(function(a,b){
            var ay=a.transform[5], by=b.transform[5];
            if(Math.abs(ay-by)>2) return by-ay;
            return a.transform[4]-b.transform[4];
          });
          var lines = [], curY=null, curLine=[];
          items.forEach(function(it){
            var y = it.transform[5];
            if(curY===null || Math.abs(y-curY)<=2){ curLine.push(it.str); if(curY===null) curY=y; }
            else { if(curLine.length) lines.push(curLine.join(' ')); curLine=[it.str]; curY=y; }
          });
          if(curLine.length) lines.push(curLine.join(' '));
          return lines;
        });
      }));
    }
    return Promise.all(pagePromises).then(function(pages){
      var all = [];
      pages.forEach(function(lines){ all = all.concat(lines); });
      return all;
    });
  });
}
/* Empareja el texto del PDF contra el catálogo de indicadores (nombre + alias).
   Muchos laboratorios (ej. ECUA American) no ponen el nombre del examen y su
   resultado en la misma línea: el nombre va en una línea y el "RESULTADO" (o,
   en paneles con una explicación larga del rango, el valor suelto) va en la
   línea siguiente. Por eso, además de intentar la coincidencia en una sola
   línea (formato antiguo), se recuerda la última línea que parecía un nombre
   de examen sin resultado propio ("pendingLine") y se usa para la línea
   siguiente si esa trae el resultado. */
function findBestMatch(text, matchers, claimed){
  var normLine = normKey(text);
  for(var i=0;i<matchers.length;i++){
    var mt = matchers[i];
    if(claimed[mt.ind.id]) continue;
    var match = normLine.match(mt.regex);
    if(!match) continue;
    return {mt:mt, endIdx: match.index + match[0].length};
  }
  return null;
}
function parseLabReportLines(lines, memberId){
  var m = memberById(memberId);
  var matchers = buildIndicatorMatchers(m.sex);
  var rows = [];
  var claimed = {};
  var pendingLine = null;
  var inUrinalysis = false;
  function pushRow(nameLine, ind, value){
    claimed[ind.id] = true;
    var ref = resolveRef(ind.id, m.sex, null);
    rows.push({id:uid('row'), rawName: nameLine.trim().slice(0,70), indicatorId: ind.id, value:value, unit: ind.unit, refMin: ref.min, refMax: ref.max});
  }
  lines.forEach(function(rawLine){
    if(!rawLine || !rawLine.trim()) return;
    var line = rawLine;
    /* El uroanálisis (examen de orina) usa nombres iguales a indicadores de
       sangre (ej. "LEUCOCITOS", "HEMATIES") pero son conteos por campo al
       microscopio, no resultados de sangre — nunca deben mezclarse. Una vez
       que aparece esta sección, se deja de buscar indicadores en el resto
       del documento (siempre es la última sección en estos informes). */
    if(/UROANALISIS|ELEMENTAL\s+Y\s+MICROSCOPICO\s+DE\s+ORINA/i.test(normKey(line))){ inUrinalysis = true; return; }
    if(inUrinalysis) return;
    if(/\/\s*campo/i.test(line)) return;
    if(/^\s*(VALOR(ES)?\s+CONFIRMADO(S)?|M[ÉE]TODO\s*:|ANALISTA\s+RESPONSABLE|P[ÁA]GINA\s+\d|FECHA DE IMPRESI[ÓO]N)/i.test(line)) return;

    /* 1) Formato de una sola línea: nombre y valor juntos. */
    var direct = findBestMatch(line, matchers, claimed);
    if(direct){
      var value1 = extractValueNear(line, direct.endIdx);
      if(value1!==null){
        pushRow(line, direct.mt.ind, value1);
        pendingLine = null;
        return;
      }
    }

    /* 2) Esta línea trae "RESULTADO ..." o empieza directo con el valor: puede
       pertenecer al nombre de examen detectado en la línea anterior. */
    var resultadoMatch = line.match(/RESULTADO\b/i);
    var looksLikeBareValue = /^\s*-?\d+(?:[.,]\d+)?(\s|$)/.test(line) || /^\s*(MENOR|MAYOR)\s+\d/i.test(line);
    if(pendingLine && (resultadoMatch || looksLikeBareValue)){
      var pending = findBestMatch(pendingLine, matchers, claimed);
      if(pending){
        var startIdx = resultadoMatch ? (resultadoMatch.index + resultadoMatch[0].length) : 0;
        var value2 = extractValueNear(line, startIdx);
        if(value2!==null) pushRow(pendingLine, pending.mt.ind, value2);
      }
      pendingLine = null;
      return;
    }

    /* 3) No coincidió nada todavía. Solo se guarda como "posible nombre de
       examen pendiente" si esta línea en sí coincide con algún indicador del
       catálogo (=="direct"==). Si NO coincide con nada, es casi seguro texto
       explicativo del rango de referencia (ej. "Mujeres: 13.0 - 150.0 ng/mL",
       "Déficit: Menor a 10 ng/mL") que en varios laboratorios aparece
       intercalado ENTRE el nombre del examen y su línea de "RESULTADO" — y
       se deja tal cual el nombre pendiente anterior, para no perderlo antes
       de que llegue su verdadero resultado. */
    if(direct) pendingLine = line;
  });
  return rows;
}
/* Intenta leer el PDF real. Si el archivo no es un PDF con texto (ej. una foto
   escaneada) o la lectura falla, no se inventan valores: se devuelve una lista
   vacía junto con una nota para que la persona los agregue manualmente. */
function extractFromDocument(memberId, file){
  if(!file){
    return Promise.resolve({rows:[], note:'No seleccionaste ningún archivo, así que no hay nada que leer automáticamente. Usa "+ Agregar indicador manualmente" para escribir los resultados.'});
  }
  var isPdf = (file.type==='application/pdf') || /\.pdf$/i.test(file.name||'');
  if(!isPdf){
    return Promise.resolve({rows:[], note:'La lectura automática todavía solo funciona con archivos PDF que contienen texto (la mayoría de laboratorios en Ecuador entregan así sus informes). Para fotos o imágenes escaneadas, agrega los resultados manualmente con "+ Agregar indicador manualmente".'});
  }
  if(typeof pdfjsLib === 'undefined'){
    return Promise.resolve({rows:[], note:'No se pudo cargar el lector de PDF (revisa tu conexión a internet e intenta de nuevo). Mientras tanto, agrega los resultados manualmente.'});
  }
  return extractPdfLines(file).then(function(lines){
    var fullText = lines.join(' ').trim();
    if(fullText.length < 20){
      return {rows:[], note:'Este PDF parece ser una imagen escaneada sin texto seleccionable, así que no pudimos leerlo automáticamente. Agrega los resultados manualmente con "+ Agregar indicador manualmente".'};
    }
    var rows = parseLabReportLines(lines, memberId);
    if(!rows.length){
      return {rows:[], note:'Leímos el PDF pero no logramos identificar automáticamente ninguno de los indicadores de nuestro catálogo en él. Agrega los resultados manualmente con "+ Agregar indicador manualmente", o revisa que el documento no sea una imagen escaneada.'};
    }
    return {rows:rows, note: rows.length<6 ? 'Encontramos '+rows.length+' indicador(es) en el documento. Si tu informe trae más, agrégalos con "+ Agregar indicador manualmente" — revisa siempre que los valores coincidan con tu reporte.' : null};
  }).catch(function(err){
    console.error('Error leyendo PDF', err);
    return {rows:[], note:'Hubo un problema leyendo este PDF (puede estar protegido o dañado). Agrega los resultados manualmente con "+ Agregar indicador manualmente".'};
  });
}

var evoRangeFilter = 'todo';
var cmpMode = 'anterior';
var cmpA = null, cmpB = null;
var CMP_LABELS = {anterior:'Examen anterior vs. actual', '6m':'Últimos 6 meses', '12m':'Últimos 12 meses', anio:'Año contra año', manual:'Selección manual'};

function monthsAgo(dateStr, n){ var d=new Date(dateStr+'T00:00:00'); d.setMonth(d.getMonth()-n); return d; }
function nearestExamIndex(exams, targetDate){
  var best=0, bestDiff=Infinity;
  exams.forEach(function(e,i){ var diff=Math.abs(new Date(e.date+'T00:00:00')-targetDate); if(diff<bestDiff){ bestDiff=diff; best=i; } });
  return best;
}
function filterByRange(hist, range){
  if(range==='todo') return hist;
  var months = range==='12m'?12:6;
  var cutoff = new Date(); cutoff.setMonth(cutoff.getMonth()-months);
  var filtered = hist.filter(function(p){ return new Date(p.date+'T00:00:00') >= cutoff; });
  return filtered.length>=2 ? filtered : hist;
}

/* Bloque de estadísticas del periodo mostrado en Evolución: además del mínimo/máximo/
   promedio y la variación vs. el control anterior (ya presentes en la ficha del
   indicador), agrega cuántos resultados del periodo cayeron fuera de rango y cuántos
   días han pasado desde el último control — el "más estadísticas" pedido, sin
   duplicar una etiqueta de valor sobre cada punto del gráfico. */
function evoStatsHtml(hist, ref){
  if(!hist.length) return '';
  var vals = hist.map(function(p){ return p.value; });
  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
  var avgV = vals.reduce(function(a,b){ return a+b; },0)/vals.length;
  var trend = computeTrend(hist);
  var pctPrev = trend.pctVsPrev;
  var outCount = hist.filter(function(p){ return (ref.min!==null && p.value<ref.min) || (ref.max!==null && p.value>ref.max); }).length;
  var lastDate = hist[hist.length-1].date;
  var daysSince = Math.max(0, Math.round((Date.now() - new Date(lastDate+'T00:00:00').getTime())/86400000));
  return '<div class="section-title" style="margin-top:22px;"><h2>Estadísticas del periodo</h2></div>'+
    '<div class="statrow">'+
      '<div class="stat"><span class="lbl">Mínimo del periodo</span><span class="num">'+fmtNum(minV)+'</span></div>'+
      '<div class="stat"><span class="lbl">Máximo del periodo</span><span class="num">'+fmtNum(maxV)+'</span></div>'+
      '<div class="stat"><span class="lbl">Promedio del periodo</span><span class="num">'+fmtNum(avgV)+'</span></div>'+
      '<div class="stat"><span class="lbl">Variación vs. anterior</span><span class="num" style="color:'+(pctPrev===null?'var(--ink-2)':(pctPrev>0?'var(--out)':'var(--stable)'))+'">'+(pctPrev===null?'—':((pctPrev>0?'+':'')+pctPrev.toFixed(1)+'%'))+'</span></div>'+
      '<div class="stat"><span class="lbl">Fuera de rango en el periodo</span><span class="num" style="color:'+(outCount>0?'var(--out)':'var(--stable)')+'">'+outCount+' de '+hist.length+'</span></div>'+
      '<div class="stat"><span class="lbl">Días desde el último control</span><span class="num">'+daysSince+'</span></div>'+
    '</div>';
}

   ========================================================= */
function renderComparatives(memberId){
  memberId = memberId || lastActiveMember;
  var m = memberById(memberId);
  var exams = allExamsForMember(memberId);
  var memberTabs = '<div class="tabs">'+MEMBERS.map(function(x){ return '<button class="tab'+(x.id===memberId?' active':'')+'" onclick="App.go(\'#/comparativos/'+x.id+'\')">'+x.name+'</button>'; }).join('')+'</div>';
  if(exams.length<2) return disclaimerBar()+memberTabs+'<div class="empty-state">Se necesitan al menos dos exámenes registrados para comparar periodos.</div>';
  var bIdx = exams.length-1, aIdx;
  if(cmpMode==='anterior') aIdx = exams.length-2;
  else if(cmpMode==='6m') aIdx = nearestExamIndex(exams, monthsAgo(exams[bIdx].date,6));
  else if(cmpMode==='12m') aIdx = nearestExamIndex(exams, monthsAgo(exams[bIdx].date,12));
  else if(cmpMode==='anio') aIdx = nearestExamIndex(exams, monthsAgo(exams[bIdx].date,12));
  else { aIdx = cmpA!==null?cmpA:0; bIdx = cmpB!==null?cmpB:exams.length-1; }
  if(aIdx===bIdx){ aIdx = bIdx>0?bIdx-1:Math.min(1,exams.length-1); }
  var examA = exams[aIdx], examB = exams[bIdx];
  var idSet = {};
  Object.keys(examA.values).forEach(function(k){ idSet[k]=true; });
  Object.keys(examB.values).forEach(function(k){ idSet[k]=true; });
  var rows = Object.keys(idSet).map(function(id){
    var ind = indicatorById(id);
    var vA = examA.values[id], vB = examB.values[id];
    var change = (vA!==undefined && vB!==undefined && vA!==0) ? ((vB-vA)/Math.abs(vA))*100 : null;
    return {ind:ind, vA:vA, vB:vB, change:change};
  }).sort(function(a,b){ return a.ind.name.localeCompare(b.ind.name); });
  var rowsHtml = rows.map(function(r){
    var arrow = r.change===null?'—':(r.change>0.5?'↑':(r.change<-0.5?'↓':'→'));
    var color = r.change===null?'var(--ink-3)':(Math.abs(r.change)<5?'var(--ink-2)':(r.change>0?'var(--out)':'var(--stable)'));
    return '<tr><td>'+r.ind.name+'</td><td class="num">'+(r.vA!==undefined?fmtNum(r.vA)+' '+r.ind.unit:'—')+'</td><td class="num">'+(r.vB!==undefined?fmtNum(r.vB)+' '+r.ind.unit:'—')+'</td><td class="num" style="color:'+color+';font-weight:700;">'+arrow+' '+(r.change===null?'':Math.abs(r.change).toFixed(1)+'%')+'</td></tr>';
  }).join('');
  var manualSelects = cmpMode==='manual' ? (
    '<select onchange="App.setCmpManual(\'A\',this.value)">'+exams.map(function(e,i){ return '<option value="'+i+'"'+(i===aIdx?' selected':'')+'>'+fmtDate(e.date)+' · '+e.name+'</option>'; }).join('')+'</select>'+
    '<span class="faint">vs.</span>'+
    '<select onchange="App.setCmpManual(\'B\',this.value)">'+exams.map(function(e,i){ return '<option value="'+i+'"'+(i===bIdx?' selected':'')+'>'+fmtDate(e.date)+' · '+e.name+'</option>'; }).join('')+'</select>'
  ) : '';
  return disclaimerBar()+memberTabs+
    '<div class="flexrow" style="margin-bottom:16px;">'+
      '<select onchange="App.setCmpMode(this.value)">'+Object.keys(CMP_LABELS).map(function(k){ return '<option value="'+k+'"'+(cmpMode===k?' selected':'')+'>'+CMP_LABELS[k]+'</option>'; }).join('')+'</select>'+
      manualSelects+
    '</div>'+
    '<div class="between" style="margin-bottom:12px;"><div class="faint" style="font-size:13px;">'+fmtDate(examA.date)+' ('+examA.name+') → '+fmtDate(examB.date)+' ('+examB.name+')</div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Indicador</th><th>Anterior</th><th>Actual</th><th>Cambio</th></tr></thead><tbody>'+rowsHtml+'</tbody></table></div>';
}

/* =========================================================
   29. BÚSQUEDA INTELIGENTE (basada exclusivamente en datos locales)
   ========================================================= */
function normalizeStr(s){ return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function performSearch(query){
  var q = normalizeStr(query);
  var qPadded = ' '+q+' ';
  var hasWord = function(phrase){ return qPadded.indexOf(' '+normalizeStr(phrase)+' ') > -1; };
  var member = MEMBERS.filter(function(mm){ return hasWord(mm.name) || hasWord(mm.name.split(' ')[0]); })[0];
  var mid = member ? member.id : lastActiveMember;
  var m = memberById(mid);
  var foundInd = null;
  Object.keys(ALIAS_LOOKUP).forEach(function(alias){ if(hasWord(alias)) foundInd = ALIAS_LOOKUP[alias]; });

  if(/mejorado|mejora/.test(q) && !foundInd){
    var sums = memberIndicatorSummaries(mid).filter(function(s){
      if(s.trend.direction!=='ascendente' && s.trend.direction!=='descendente') return false;
      var favorable=null;
      if(s.ref.max!==null && s.ref.min===null) favorable = s.trend.direction==='descendente';
      else if(s.ref.min!==null && s.ref.max===null) favorable = s.trend.direction==='ascendente';
      return favorable===true;
    });
    return {text: sums.length? ('Indicadores que han mejorado en '+m.name+': '+sums.map(function(s){return s.indicator.name;}).join(', ')+'.') : ('No se identificaron indicadores con una mejora clara en el historial de '+m.name+'.')};
  }
  if(/fuera de rango/.test(q) && /(una vez|varias|más de|mas de)/.test(q) && !foundInd){
    var sums2 = memberIndicatorSummaries(mid).filter(function(s){ return s.level==='fuera'||s.level==='atencion'; });
    return {text: sums2.length? ('Indicadores de '+m.name+' con salidas del rango de referencia: '+sums2.map(function(s){return s.indicator.name;}).join(', ')+'.') : ('Ningún indicador de '+m.name+' registra actualmente una salida del rango de referencia.')};
  }
  if(foundInd){
    var hist = indicatorHistory(mid, foundInd);
    var ind = indicatorById(foundInd);
    if(!hist.length) return {text:'No hay registros de '+ind.name+' para '+m.name+'.'};
    var trend = computeTrend(hist);
    if(/mas alto|maximo|mayor/.test(q)){
      var mx = Math.max.apply(null, hist.map(function(p){return p.value;}));
      return {text:'El valor más alto de '+ind.name+' registrado para '+m.name+' es '+fmtNum(mx)+' '+ind.unit+'.', link:{hash:'#/indicador/'+mid+'/'+foundInd, label:'Ver ficha completa'}};
    }
    if(/mas bajo|minimo|menor/.test(q)){
      var mn = Math.min.apply(null, hist.map(function(p){return p.value;}));
      return {text:'El valor más bajo de '+ind.name+' registrado para '+m.name+' es '+fmtNum(mn)+' '+ind.unit+'.', link:{hash:'#/indicador/'+mid+'/'+foundInd, label:'Ver ficha completa'}};
    }
    if(/evoluc/.test(q)){
      return {text: ind.name+' en '+m.name+' ha mostrado una tendencia '+trend.direction+' a lo largo de '+hist.length+' controles. Último resultado: '+fmtNum(hist[hist.length-1].value)+' '+ind.unit+' ('+fmtDate(hist[hist.length-1].date)+').', link:{hash:'#/indicador/'+mid+'/'+foundInd, label:'Ver evolución completa'}};
    }
    return {text:'Resultados de '+ind.name+' para '+m.name+': '+hist.map(function(p){return fmtDate(p.date)+' → '+fmtNum(p.value)+' '+ind.unit;}).join(' · ')+'.', link:{hash:'#/indicador/'+mid+'/'+foundInd, label:'Ver ficha completa'}};
  }
  return {text:'La búsqueda entiende preguntas sobre indicadores y miembros registrados, por ejemplo: “¿cómo ha evolucionado mi colesterol?”, “¿cuál ha sido mi valor más alto de triglicéridos?” o “¿qué indicadores han mejorado?”. No se encontró una coincidencia clara para tu consulta.'};
}

  return root;
}
function openModal(html){ ensureModalRoot().innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this) App.closeModal()"><div class="modal">'+html+'</div></div>'; }
function closeModalFn(){ var root = document.getElementById('modal-root'); if(root) root.innerHTML=''; }
function openMobileMenuFn(){

    NAV_ITEMS.map(function(it){ return '<button class="navlink" style="padding:14px 10px;" onclick="App.closeModal();App.go(\''+it.hash()+'\')"><span class="ic">'+it.icon+'</span>'+it.label+'</button>'; }).join('') +
  '</div></div>';
}
function openScoreInfoFn(memberId){
  var m = memberById(memberId);
  var score = computeHealthScore(memberId);
  if(score.score===null){ openModal('<p>Aún no hay suficientes datos para calcular este índice.</p>'); return; }
  var b = score.breakdown;
  openModal(
    '<div class="between"><h3 style="margin:0;">Índice de seguimiento · '+m.name+'</h3><button class="btn btn-ghost btn-sm" onclick="App.closeModal()">✕</button></div>'+
    '<div style="font-size:40px;font-family:\'Fraunces\',serif;font-weight:600;margin:14px 0 4px;">'+score.score+'%</div>'+
    '<span class="pill pill-stable" style="margin-bottom:16px;">'+score.bandIcon+' '+score.band+'</span>'+
    '<div class="card-flat" style="padding:6px 16px;">'+
      '<div class="kv-row"><span>Indicadores dentro de rango ('+b.optimo+' / '+b.total+')</span><span class="num" style="color:var(--stable);white-space:nowrap;">+'+b.base.toFixed(1)+' pts</span></div>'+
      '<div class="kv-row"><span>Bono por estabilidad histórica</span><span class="num" style="color:var(--stable);white-space:nowrap;">+'+b.stabilityBonus.toFixed(1)+' pts</span></div>'+
      '<div class="kv-row"><span>Penalización por persistencia fuera de rango</span><span class="num" style="color:var(--alert);white-space:nowrap;">−'+b.persistencePenalty.toFixed(1)+' pts</span></div>'+
      '<div class="kv-row"><span>Penalización por variabilidad</span><span class="num" style="color:var(--out);white-space:nowrap;">−'+b.variabilityPenalty.toFixed(1)+' pts</span></div>'+
    '</div>'+
    '<p class="faint" style="font-size:12px;margin-top:14px;">Este indicador es únicamente una representación visual del comportamiento histórico de los resultados registrados. No representa un diagnóstico médico ni una evaluación clínica integral.</p>'
  );
}
function viewExamFn(examId, memberId){ openModal(renderExamModalContent(examId, memberId)); }
function notImplementedFn(feature){
  openModal('<h3 style="margin-top:0;">'+escapeHtml(feature)+'</h3><p class="muted">Esta función forma parte del diseño de la plataforma; en esta primera versión de demostración no está conectada a un archivo real. En una versión productiva, aquí se completaría la acción sobre el documento original.</p><div style="text-align:right;margin-top:16px;"><button class="btn btn-primary" onclick="App.closeModal()">Entendido</button></div>');
}

/* =========================================================
   31. ACCIONES DE ESCRITURA (carga, edición, borrado) + PERSISTENCIA
   ========================================================= */
function updateRowFn(rowId, field, value){
  var row = uploadDraft.rows.filter(function(r){ return r.id===rowId; })[0];
  if(row) row[field] = value;
}
function rowIndicatorChangeFn(rowId, indicatorId){
  var row = uploadDraft.rows.filter(function(r){ return r.id===rowId; })[0];
  if(!row) return;
  row.indicatorId = indicatorId;
  var ind = indicatorById(indicatorId);
  var m = memberById(uploadDraft.memberId);
  var ref = resolveRef(indicatorId, m.sex, null);
  row.unit = ind.unit; row.refMin = ref.min; row.refMax = ref.max;
  var tr = document.querySelector('tr[data-row="'+rowId+'"]');
  if(tr){
    var inputs = tr.querySelectorAll('input');
    if(inputs[2]) inputs[2].value = row.unit;
    if(inputs[3]) inputs[3].value = row.refMin===null?'':row.refMin;
    if(inputs[4]) inputs[4].value = row.refMax===null?'':row.refMax;
  }
}
function addManualRowFn(){
  var def = INDICATORS[0];
  var m = memberById(uploadDraft.memberId);
  var ref = resolveRef(def.id, m.sex, null);
  uploadDraft.rows.push({id:uid('row'), rawName:def.name, indicatorId:def.id, value:0, unit:def.unit, refMin:ref.min, refMax:ref.max});
  renderScreen(parseRoute());
}
function removeRowFn(rowId){
  uploadDraft.rows = uploadDraft.rows.filter(function(r){ return r.id!==rowId; });
  renderScreen(parseRoute());
}
function pickFileFn(input){
  var f = input.files && input.files[0];
  uploadDraft.fileName = f ? f.name : '';
  uploadDraft.file = f || null;
}
function changeDraftMemberFn(memberId){ uploadDraft = newDraft(memberId); navigate('#/examenes/'+memberId+'/subir'); }
function runExtractionFn(){
  if(!uploadDraft.lab) uploadDraft.lab = 'Laboratorio no especificado';
  var btn = document.querySelector('button[onclick="App.runExtraction()"]');
  if(btn){ btn.disabled = true; btn.textContent = '🔎 Leyendo documento…'; }
  var memberId = uploadDraft.memberId, file = uploadDraft.file;
  extractFromDocument(memberId, file).then(function(result){
    if(!uploadDraft || uploadDraft.memberId!==memberId) return; // el usuario cambió de miembro mientras se analizaba
    uploadDraft.rows = result.rows;
    uploadDraft.extractionNote = result.note || null;
    navigate('#/examenes/'+memberId+'/validar');
  });
}
function confirmUploadFn(){
  var d = uploadDraft;
  var values = {};
  d.rows.forEach(function(r){ if(r.indicatorId && r.value!==null && r.value!==undefined && !isNaN(r.value)) values[r.indicatorId]=r.value; });

  if(BACKEND_MODE==='supabase'){
    var btn = document.querySelector('button[onclick="App.confirmUpload()"]');
    if(btn){ btn.disabled = true; btn.textContent = 'Guardando…'; }
    sb.from('exams').insert({ member_id:d.memberId, date:d.date, lab:d.lab||'No especificado', name:d.examName })
      .select().single().then(function(res){
        if(res.error) throw res.error;
        var exam = res.data;
        var resultRows = d.rows.filter(function(r){ return r.indicatorId && !isNaN(r.value); }).map(function(r){
          return { exam_id:exam.id, indicator_id:r.indicatorId, raw_name:r.rawName, value:r.value, unit:r.unit, ref_min:r.refMin, ref_max:r.refMax };
        });
        var chain = resultRows.length ? sb.from('results').insert(resultRows) : Promise.resolve({error:null});
        return chain.then(function(rres){
          if(rres.error) throw rres.error;
          if(d.file){
            var path = d.memberId+'/'+exam.id+'-'+d.file.name;
            return sb.storage.from('exam-pdfs').upload(path, d.file).then(function(upRes){
              if(upRes.error){ console.warn('No se pudo subir el PDF:', upRes.error.message); return; }
              return sb.from('exams').update({pdf_path:path}).eq('id', exam.id);
            });
          }
        });
      }).then(function(){
        return loadFamilyData();
      }).then(function(){
        uploadDraft = null;
        navigate('#/examenes/'+d.memberId);
      }).catch(function(err){
        openModal('<h3 style="margin-top:0;">No se pudo guardar</h3><p class="muted">'+escapeHtml((err&&err.message)||'Ocurrió un problema al conectar con la base de datos.')+'</p><div style="text-align:right;margin-top:16px;"><button class="btn btn-primary" onclick="App.closeModal()">Entendido</button></div>');
      });
    return;
  }

  var examObj = {id: uid('exam'), memberId:d.memberId, date:d.date, lab:d.lab||'No especificado', name:d.examName, values:values, source:'added', uploadedAt:new Date().toISOString()};
  mutableState.addedExams.push(examObj);
  uploadDraft = null;
  navigate('#/examenes/'+examObj.memberId);
  attemptPersist();
}
function deleteExamFn(examId, memberId){
  openModal(
    '<h3 style="margin-top:0;">¿Eliminar este examen?</h3>'+
    '<p class="muted">Esta acción eliminará el examen y todos sus resultados asociados. No se puede deshacer.</p>'+
    '<div class="flexrow" style="justify-content:flex-end;margin-top:18px;">'+
      '<button class="btn" onclick="App.closeModal()">Cancelar</button>'+
      '<button class="btn btn-primary" style="background:var(--alert);border-color:var(--alert);" onclick="App.reallyDeleteExam(\''+examId+'\',\''+memberId+'\')">Eliminar</button>'+
    '</div>'
  );
}
function reallyDeleteExamFn(examId, memberId){
  if(BACKEND_MODE==='supabase'){
    sb.from('exams').delete().eq('id', examId).then(function(res){
      if(res.error) throw res.error;
      return loadFamilyData();
    }).then(function(){
      closeModalFn();
      navigate('#/examenes/'+memberId);
    }).catch(function(err){
      closeModalFn();
      openModal('<p>No se pudo eliminar el examen: '+escapeHtml((err&&err.message)||'error de conexión')+'</p>');
    });
    return;
  }
  mutableState.deletedExamIds.push(examId);
  mutableState.addedExams = mutableState.addedExams.filter(function(e){ return e.id!==examId; });
  closeModalFn();
  navigate('#/examenes/'+memberId);
  attemptPersist();
}
function viewPdfFn(path){
  if(BACKEND_MODE!=='supabase'){ notImplementedFn('Ver PDF original'); return; }
  sb.storage.from('exam-pdfs').createSignedUrl(path, 60).then(function(res){
    if(res.error || !res.data){ openModal('<p>No se pudo abrir el PDF: '+escapeHtml((res.error&&res.error.message)||'archivo no disponible')+'</p>'); return; }
    window.open(res.data.signedUrl, '_blank');
  });
}
function buildPublishHTML(){
  var styleEl = document.getElementById('app-style');
  var scriptEl = document.getElementById('app-script');
  var seedJson = JSON.stringify(mutableState).replace(/</g,'\\u003c');
  return '<!doctype html>\n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+
    TITLE_HTML+
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
    '<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">'+
    styleEl.outerHTML+
    '</head><body><div id="app"></div>'+
    '<script id="seed-data" type="application/json">'+seedJson+'<\/script>'+
    scriptEl.outerHTML+
    '</body></html>';
}
function attemptPersist(){
  renderPersistenceBadge();
  if(!artifactAPI) return;
  artifactAPI.publish(buildPublishHTML()).catch(function(err){
    console.warn('No se pudo guardar de forma permanente:', err && err.code);
    var el = document.getElementById('persistence-badge');
    if(el) el.textContent = '⚠ No se pudo guardar de forma permanente';
  });
}
function exportDataFn(){
  var payload = {generadoEl:new Date().toISOString(), miembros:MEMBERS, examenes: MEMBERS.reduce(function(acc,m){ acc[m.id]=allExamsForMember(m.id); return acc; },{})};
  var json = JSON.stringify(payload, null, 2);
  if(downloadsAPI){
    downloadsAPI.save({filename:'health-timeline-export.json', data:json}).catch(function(err){
      if(!err || err.code!=='declined') openModal('<p>No se pudo generar la descarga en este momento.</p>');
    });
  } else {
    openModal('<h3 style="margin-top:0;">Exportar datos</h3><p class="muted">La descarga de archivos no está disponible en esta vista de previsualización.</p>');
  }
}

var searchQuery = '';

  searchQuery = e.target.value;
  if(e.key==='Enter') runSearchFn(searchQuery);

function runSearchFn(q){
  if(!q || !q.trim()) return;
  var res = performSearch(q);

    '<p class="faint" style="font-size:12.5px;margin-top:2px;">“'+escapeHtml(q)+'”</p>'+
    '<div class="card-flat" style="margin-top:10px;">'+escapeHtml(res.text)+'</div>'+
    (res.link? ('<button class="btn btn-primary" style="margin-top:14px;" onclick="App.closeModal();App.go(\''+res.link.hash+'\')">'+res.link.label+' →</button>') : '')+
    '<p class="faint" style="font-size:11px;margin-top:14px;">Las respuestas se generan exclusivamente a partir de los resultados registrados en esta plataforma.</p>'
  );
}
